    <meta property="og:image:alt" content="Smart Home Repair - same-day AC and home appliance repair in Kochi">

    <!-- Twitter -->

    <meta name="twitter:title" content="Smart Home Repair - Kochi 2-Hour AC Service">

    <!-- Fonts are self-hosted in style.css, so first paint no longer waits on
         two third-party font stylesheets. The latin subset is preloaded: it is
         only 27 KB and preloading shortens the fallback window, which is the
         only thing that can move the hero (measured CLS 0.01 worst case).
         File names carry a content hash and are cached for a year. -->
    <link rel="preload" href="/static/fonts/plus-jakarta-sans-latin.153fc85b.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script>function toggleMenu(){var m=document.getElementById('mm');if(!m)return;var open=m.classList.toggle('open');m.setAttribute('aria-hidden',open?'false':'true');var b=document.getElementById('mmBtn');if(b)b.setAttribute('aria-expanded',open?'true':'false');document.body.classList.toggle('menu-open',open)}function closeMM(){var m=document.getElementById('mm');if(!m)return;m.classList.remove('open');m.setAttribute('aria-hidden','true');var b=document.getElementById('mmBtn');if(b)b.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')}function closeModal(){var m=document.getElementById('modalOverlay');if(m)m.classList.remove('active')}function closeContactModal(){var m=document.getElementById('contactModalOverlay');if(m)m.classList.remove('active');localStorage.setItem('popupShown','true')}</script>
